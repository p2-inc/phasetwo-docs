# Blog authors.
#
# Attribution was reconstructed from the commit that first added each post
# (`git log --diff-filter=A`). Named bylines are an E-E-A-T signal for search and the
# primary attribution heuristic used by LLMs, so prefer a person over the org account.
#
# `description` renders in the author-bio footer under each post (see
# src/components/AuthorBio). The bios below are stubs — replace with real copy.

gpatil:
  name: GR Patil
  title: Phase Two
  url: https://github.com/xgp
  image_url: https://avatars.githubusercontent.com/u/244253?v=4
  page: true
  socials:
