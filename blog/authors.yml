  description: >-
    GR is the co-founder and CEO of Phase Two, and has been working on Keycloak for 10+ years, 
    and running Phase Two for the past 6. A technology entrepreneur for 30 years, he was a 
    founder at BrightRoll (sold to Yahoo! for $640M), an early engineer at Twitter, and founded 
    or led several successful early-stage startups.

